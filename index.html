<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body>
  <main class="w-full h-screen *:selection:bg-green-300 *:selection:text-white  ">
    <div class="container mx-auto ">
      <nav
        class="  flex items-center h-[10vh] justify-between px-4 lg:px-14 lg:py-4 lg:text-[1.2vw] text-2xl font-[500] font-mono from-neutral-900 uppercase ">
        <div class="left flex items-center justify-between gap-28  h-full">
          <i class="fa-duotone fa-solid fa-hexagon-nodes"></i>
          <h3 class="cursor-pointer hover:border-b-2 border-black ">Neganou.design</h3>
        </div>
        <div class="right hidden lg:flex items-center justify-between gap-12 ">
          <h3 class="text-xm cursor-pointer opacity-70 font-bold">Works</h3>
          <h3 class="text-xm cursor-pointer opacity-70 font-bold">Service</h3>
          <h3 class="text-xm cursor-pointer opacity-70 font-bold">Contact us</h3>
          <h3 class="text-xm cursor-pointer opacity-70 font-bold">career</h3>
        </div>
        <i class="fa-solid fa-bars lg:hidden cursor-pointer"></i>
      </nav>
    </div>
    <div class="w-full flex flex-col items-center justify-center mt-32 lg:mt-20">
      <div class="image w-24 h-24 lg:w-40 lg:h-40 rounded-full bg-black ">
        <img class="w-full h-full object-cover object-top rounded-full"
          src="https://i.pinimg.com/236x/a4/ff/5e/a4ff5e372a64c2161517a8d1b8134d5e.jpg" alt="image">
      </div>
      <h3 class=" font-semibold text-center pt-3 pl-6 text-xl">I'm Rishabh ✋</h3>
      <h1 class="text-3xl lg:text-4xl text-center font-semibold mt-6 tracking-tighter leading-2">
        Building digital <br> products, brands and <br> experience.
      </h1>
      <p class="text-center w-3/4 mt-4 text-sm font-semibold lg:text-xl tracking-tight">
        Hi i'm Rishabh Building digital products, brands, experience and visual development.
      </p>
      <button
        class=" px-4 py-2 bg-zinc-800 text-white rounded-full text-xs lg:text-base  font-semibold tracking-tight mt-6  hover:bg-slate-400 hover:transition-all hoverduration-1000 ">Connect
        with me</button>
    </div>
  </main>
</body>

</html>
